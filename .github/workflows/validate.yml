name: Validate progression
on: [push, pull_request]
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r tools/test-requirements.txt
      - run: node --test tests/runtime.test.js tests/access-and-guard.test.js
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/validate_game_pack.py
      - run: python companion/test_policy.py
